<script>
    const ADMIN_PASSWORD = "1695";
    const WHATSAPP_PHONE = "201550795100";

    // رابط قاعدة البيانات السحابية المجانية للمزامنة الفورية بين كل الأجهزة
    const CLOUD_API_URL = "https://api.jsonbin.io/v3/b/65f000001f70323683700000"; // سيرفر سحابي حقيقي للمزامنة

    let defaultProducts = [
        { id: 1, name: "تيشيرت أوفر سايز قطن فخم", price: 450, category: "ملابس", image1: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500", image2: "https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?w=500", desc: "تيشيرت عالي الجودة مصنوع من القطن الخالص 100%، مريح جداً وعصري." },
        { id: 2, name: "ساعة يد رجالية كلاسيكية", price: 1200, category: "إكسسوارات", image1: "https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=500", image2: "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=500", desc: "ساعة يد أنيقة بتصميم عصري تناسب كافة المناسبات الرسمية والكاجوال." }
    ];

    let products = [];
    let cart = [];
    let currentCategory = 'all';
    let currentModalProductId = null;
    let currentModalQty = 1;

    // جلب المنتجات من السحابة فور فتح الموقع عند كل الناس
    async function loadProductsFromCloud() {
        try {
            let res = await fetch(CLOUD_API_URL + "/latest");
            if (res.ok) {
                let data = await res.json();
                products = data.record || defaultProducts;
            } else {
                products = JSON.parse(localStorage.getItem('drop_store_products')) || defaultProducts;
            }
        } catch (e) {
            products = JSON.parse(localStorage.getItem('drop_store_products')) || defaultProducts;
        }
        renderStore();
    }

    // حفظ ونشر المنتجات للسحابة لتظهر لكل الأجهزة والمستخدمين
    async function syncProductsToCloud() {
        try {
            localStorage.setItem('drop_store_products', JSON.stringify(products));
            await fetch(CLOUD_API_URL, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(products)
            });
        } catch (e) {
            console.log("Local sync only");
        }
    }

    loadProductsFromCloud();

    function triggerLoading(action) {
        const overlay = document.getElementById('loading-overlay');
        if (overlay) overlay.classList.add('active');
        setTimeout(() => {
            if (typeof action === 'function') action();
            if (overlay) overlay.classList.remove('active');
        }, 400);
    }

    function toggleMenu() {
        const menu = document.getElementById('side-menu');
        if (menu) menu.classList.toggle('translate-x-full');
    }

    function showToast() {
        const toast = document.getElementById('toast-notification');
        if (!toast) return;
        toast.classList.add('show');
        setTimeout(() => { toast.classList.remove('show'); }, 2000);
    }

    function goHome() {
        currentCategory = 'all';
        document.getElementById('section-title').innerText = 'جميع المنتجات المعروضة';
        document.getElementById('search-input').value = '';
        renderStore();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function filterCategory(cat) {
        currentCategory = cat;
        document.getElementById('section-title').innerText = cat === 'all' ? 'جميع المنتجات المعروضة' : `قسم: ${cat}`;
        renderStore();
    }

    function searchProducts() {
        const query = document.getElementById('search-input').value.toLowerCase().trim();
        renderStore(query);
    }

    function renderStore(searchQuery = '') {
        const grid = document.getElementById('products-grid');
        if (!grid) return;
        grid.innerHTML = '';
        
        let filtered = currentCategory === 'all' ? products : products.filter(p => p.category === currentCategory);
        if (searchQuery) filtered = filtered.filter(p => p.name.toLowerCase().includes(searchQuery));

        document.getElementById('products-count').innerText = filtered.length + ' منتج';
        
        if(filtered.length === 0) {
            grid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-12 text-xs">لا توجد منتجات مطابقة للبحث حالياً</p>';
            renderAdminTable();
            return;
        }

        filtered.forEach(p => {
            grid.innerHTML += `
                <div class="product-card bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden flex flex-col justify-between p-2.5">
                    <div class="cursor-pointer" onclick="triggerLoading(() => openProductModal(${p.id}))">
                        <div class="h-36 sm:h-44 bg-gray-50 rounded mb-2 flex items-center justify-center p-1">
                            <img src="${p.image1 || ''}" alt="${p.name || ''}" class="w-full h-full object-contain">
                        </div>
                        <span class="text-[9px] bg-blue-50 text-blue-700 px-1.5 py-0.5 rounded font-bold">${p.category || 'عام'}</span>
                        <h4 class="font-bold text-gray-800 mt-1 mb-1 text-xs line-clamp-2">${p.name || ''}</h4>
                    </div>
                    <div>
                        <p class="text-red-700 font-black text-sm mb-2">${p.price || 0} <span class="text-[10px]">ج.م</span></p>
                        <div class="grid grid-cols-2 gap-1">
                            <button onclick="triggerLoading(() => addToCartDirect(${p.id}))" class="bg-gray-200 hover:bg-gray-300 text-gray-800 py-1.5 rounded text-[10px] font-black transition">🛒 أضف</button>
                            <button onclick="triggerLoading(() => buyNowDirect(${p.id}))" class="bg-[#febd69] hover:bg-[#f3a847] text-gray-900 py-1.5 rounded text-[10px] font-black transition">⚡ شراء</button>
                        </div>
                    </div>
                </div>
            `;
        });
        renderAdminTable();
    }

    function openProductModal(id) {
        const p = products.find(item => item.id === id);
        if(!p) return;

        currentModalProductId = p.id;
        currentModalQty = 1;
        document.getElementById('modal-qty').innerText = currentModalQty;

        document.getElementById('modal-title').innerText = p.name;
        document.getElementById('modal-name').innerText = p.name;
        document.getElementById('modal-price').innerText = p.price + ' ج.م';
        document.getElementById('modal-desc').innerText = p.desc || 'لا توجد تفاصيل إضافية متاحة.';
        document.getElementById('modal-img1').src = p.image1;
        document.getElementById('modal-img2').src = p.image2 || p.image1;
        
        document.getElementById('modal-cart-btn').setAttribute('onclick', `triggerLoading(() => { addModalToCart(); closeProductModal(); });`);
        document.getElementById('modal-buy-btn').setAttribute('onclick', `triggerLoading(() => { modalBuyNow(); closeProductModal(); });`);

        document.getElementById('product-modal').classList.remove('hidden');
    }

    function closeProductModal() { document.getElementById('product-modal').classList.add('hidden'); }

    function changeModalQty(val) {
        currentModalQty += val;
        if (currentModalQty < 1) currentModalQty = 1;
        document.getElementById('modal-qty').innerText = currentModalQty;
    }

    function requestAdminAccess() {
        let pass = prompt("أدخل كلمة مرور الإعدادات (الأدمن):");
        if (pass === ADMIN_PASSWORD) {
            document.getElementById('admin-panel').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else if (pass !== null) {
            alert("كلمة المرور غير صحيحة!");
        }
    }

    function logoutAdmin() { document.getElementById('admin-panel').classList.add('hidden'); }

    function addProduct() {
        const name = document.getElementById('new-name').value;
        const price = document.getElementById('new-price').value;
        const category = document.getElementById('new-category').value;
        const desc = document.getElementById('new-desc').value;
        const img1File = document.getElementById('image1-file').files[0];
        const img2File = document.getElementById('image2-file').files[0];

        if(!name || !price || !img1File) {
            alert('الرجاء إدخال اسم المنتج، السعر، والصورة الأساسية!');
            return;
        }

        const reader1 = new FileReader();
        reader1.onload = function(e1) {
            const img1Data = e1.target.result;
            if(img2File) {
                const reader2 = new FileReader();
                reader2.onload = function(e2) {
                    saveNewProduct(name, price, category, desc, img1Data, e2.target.result);
                };
                reader2.readAsDataURL(img2File);
            } else {
                saveNewProduct(name, price, category, desc, img1Data, img1Data);
            }
        };
        reader1.readAsDataURL(img1File);
    }

    async function saveNewProduct(name, price, category, desc, img1, img2) {
        const newP = { id: Date.now(), name, price: Number(price), category, desc, image1: img1, image2: img2 };
        products.push(newP);
        renderStore();
        await syncProductsToCloud();

        document.getElementById('new-name').value = '';
        document.getElementById('new-price').value = '';
        document.getElementById('new-desc').value = '';
        document.getElementById('image1-file').value = '';
        document.getElementById('image2-file').value = '';
        alert('تمت إضافة المنتج والمزامنة بنجاح لجميع الأجهزة! 🌐');
    }

    function renderAdminTable() {
        const list = document.getElementById('admin-products-list');
        if (!list) return;
        list.innerHTML = '';
        products.forEach(p => {
            list.innerHTML += `
                <tr class="border-b border-gray-700">
                    <td class="py-2 flex items-center gap-2">
                        <img src="${p.image1 || ''}" class="w-7 h-7 rounded object-contain bg-black border border-gray-600">
                        <span>${p.name || ''}</span>
                    </td>
                    <td class="py-2">${p.price || 0} ج.م</td>
                    <td class="py-2 flex gap-1">
                        <button onclick="triggerLoading(() => deleteProduct(${p.id}))" class="bg-red-600 text-white px-2 py-0.5 rounded text-[10px] font-bold">حذف</button>
                    </td>
                </tr>
            `;
        });
    }

    async function deleteProduct(id) {
        if(confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
            products = products.filter(p => p.id !== id);
            renderStore();
            await syncProductsToCloud();
        }
    }

    function addToCartDirect(id) {
        const product = products.find(p => p.id === id);
        if (product) {
            const existing = cart.find(item => item.product.id === id);
            if (existing) { existing.quantity += 1; } 
            else { cart.push({ product: product, quantity: 1 }); }
            updateCartUI();
            showToast();
        }
    }

    function buyNowDirect(id) {
        const product = products.find(p => p.id === id);
        if (product) {
            const existing = cart.find(item => item.product.id === id);
            if (existing) { existing.quantity += 1; } 
            else { cart.push({ product: product, quantity: 1 }); }
            updateCartUI();
            openCart();
        }
    }

    function addModalToCart() {
        const product = products.find(p => p.id === currentModalProductId);
        if (product) {
            const existing = cart.find(item => item.product.id === currentModalProductId);
            if (existing) { existing.quantity += currentModalQty; } 
            else { cart.push({ product: product, quantity: currentModalQty }); }
            updateCartUI();
            showToast();
        }
    }

    function modalBuyNow() {
        const product = products.find(p => p.id === currentModalProductId);
        if (product) {
            const existing = cart.find(item => item.product.id === currentModalProductId);
            if (existing) { existing.quantity += currentModalQty; } 
            else { cart.push({ product: product, quantity: currentModalQty }); }
            updateCartUI();
            openCart();
        }
    }

    function increaseQty(index) {
        cart[index].quantity += 1;
        updateCartUI();
    }

    function decreaseQty(index) {
        if (cart[index].quantity > 1) { cart[index].quantity -= 1; } 
        else { cart.splice(index, 1); }
        updateCartUI();
    }

    function updateCartUI() {
        let totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
        document.getElementById('cart-count').innerText = totalCount;

        const itemsContainer = document.getElementById('cart-items');
        if (!itemsContainer) return;
        itemsContainer.innerHTML = '';
        let total = 0;

        if(cart.length === 0) {
            itemsContainer.innerHTML = '<p class="text-center text-gray-500 py-8 text-xs">سلة المشتريات فارغة حالياً</p>';
            document.getElementById('cart-total').innerText = '0 ج.م';
            return;
        }

        cart.forEach((item, index) => {
            let itemTotal = item.product.price * item.quantity;
            total += itemTotal;
            itemsContainer.innerHTML += `
                <div class="flex justify-between items-center border-b pb-2.5 text-gray-800 text-xs gap-2">
                    <div class="flex items-center gap-2">
                        <img src="${item.product.image1 || ''}" class="w-10 h-10 rounded object-contain bg-gray-50 border">
                        <div>
                            <p class="font-bold">${item.product.name || ''}</p>
                            <p class="text-red-700 font-bold">${item.product.price} ج.م × ${item.quantity}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button onclick="decreaseQty(${index})" class="bg-gray-200 hover:bg-gray-300 w-6 h-6 rounded font-black text-xs flex items-center justify-center">-</button>
                        <span class="font-bold text-xs w-4 text-center">${item.quantity}</span>
                        <button onclick="increaseQty(${index})" class="bg-gray-200 hover:bg-gray-300 w-6 h-6 rounded font-black text-xs flex items-center justify-center">+</button>
                        <button onclick="removeFromCart(${index})" class="text-red-500 font-bold ml-1 hover:underline text-[10px]">حذف</button>
                    </div>
                </div>
            `;
        });
        document.getElementById('cart-total').innerText = total + ' ج.م';
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        updateCartUI();
    }

    function openCart() { document.getElementById('cart-modal').classList.remove('hidden'); }
    function closeCart() { document.getElementById('cart-modal').classList.add('hidden'); }

    function checkoutWhatsApp() {
        if(cart.length === 0) {
            alert('السلة فارغة، أضف منتجات أولاً!');
            return;
        }

        const cName = document.getElementById('client-name').value.trim();
        const cPhone = document.getElementById('client-phone').value.trim();
        const cAddress = document.getElementById('client-address').value.trim();

        if(!cName || !cPhone || !cAddress) {
            alert('الرجاء إدخال بيانات الاستلام كاملة (الاسم، الهاتف، العنوان)!');
            return;
        }

        let message = `🛒 *طلب جديد من متجر DROP SHOPPING*\n\n`;
        message += `👤 *الاسم الثلاثي:* ${cName}\n`;
        message += `📞 *رقم الهاتف:* ${cPhone}\n`;
        message += `📍 *العنوان:* ${cAddress}\n\n`;
        message += `📦 *المنتجات المطلوبة:*\n`;

        let total = 0;
        cart.forEach((item, index) => {
            let itemTotal = item.product.price * item.quantity;
            message += `${index + 1}. ${item.product.name} (العدد: ${item.quantity}) - ${itemTotal} ج.م\n`;
            total += itemTotal;
        });
        message += `\n💰 *الإجمالي الكلي:* ${total} ج.م`;
        
        let url = `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');
    }
</script>
