<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DROP SHOPPING - المتجر الرسمي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- مكتبات Firebase السحابية -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * { font-family: 'Tajawal', sans-serif; }
        
        /* الثيمات (فاتح / داكن) */
        body.light-theme { background-color: #eaeded; color: #0f1111; }
        body.light-theme .custom-card { background: #ffffff; border-color: #d5d9d9; color: #0f1111; }
        body.light-theme .header-bg { background: #131921; color: #ffffff; }

        body.dark-theme { background-color: #0b0f15; color: #f3f4f6; }
        body.dark-theme .custom-card { background: #131921; border-color: #232f3e; color: #f3f4f6; }
        body.dark-theme .header-bg { background: #0d1217; color: #ffffff; border-bottom: 1px solid rgba(254, 189, 105, 0.2); }

        .product-card { transition: all 0.2s ease-in-out; border-radius: 8px; }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
        
        .gold-brand-text {
            background: linear-gradient(135deg, #f3a847 0%, #febd69 50%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            letter-spacing: 1px;
        }

        #loading-overlay {
            position: fixed; inset: 0; background: rgba(19, 25, 33, 0.85); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;
            transition: opacity 0.3s ease; opacity: 0; pointer-events: none;
        }
        #loading-overlay.active { opacity: 1; pointer-events: auto; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #febd69; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #toast-notification {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: #131921; color: #febd69; border: 1px solid rgba(254, 189, 105, 0.4);
            padding: 10px 20px; border-radius: 30px; font-weight: bold; font-size: 13px; z-index: 10000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); transition: transform 0.3s ease, opacity 0.3s ease; opacity: 0;
        }
        #toast-notification.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        
        .thumb-img.active { border-color: #e77600 !important; }
    </style>
</head>
<body class="light-theme flex flex-col min-h-screen">

    <div id="loading-overlay">
        <div class="spinner mb-3"></div>
        <p id="loading-text" class="text-sm font-bold text-amber-400">جاري التحميل...</p>
    </div>

    <div id="toast-notification">✨ تمت إضافة المنتج إلى السلة بنجاح</div>

    <!-- الهيدر الرئيسي -->
    <header class="header-bg sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <button onclick="toggleMenu()" class="text-[#febd69] text-2xl font-bold focus:outline-none p-1 transition">☰</button>
                <div class="cursor-pointer flex flex-col" onclick="triggerLoading(goHome)">
                    <span class="text-lg sm:text-xl uppercase gold-brand-text leading-tight">DROP</span>
                    <span class="text-[10px] uppercase tracking-widest text-amber-300 font-bold">SHOPPING</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="openProfileModal()" class="flex items-center gap-1 bg-[#232f3e] hover:bg-[#374151] border border-gray-700 px-3 py-1.5 rounded-full text-amber-400 text-xs font-bold transition shadow-sm" title="إعدادات البروفايل">
                    👤 <span class="hidden sm:inline">حسابي / الإعدادات</span>
                </button>
                <button onclick="triggerLoading(openCart)" class="flex items-center gap-1.5 bg-[#232f3e] hover:bg-[#374151] border border-gray-700 px-3.5 py-1.5 rounded-md text-[#febd69] font-bold transition">
                    🛒 <span id="cart-count" class="bg-[#febd69] text-gray-950 text-xs px-1.5 py-0.2 rounded-full font-black">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- القائمة الجانبية -->
    <div id="side-menu" class="fixed inset-y-0 right-0 bg-[#131921] text-white w-[280px] shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col justify-between p-5 border-l border-gray-800">
        <div>
            <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-3">
                <span class="font-black text-sm text-[#febd69]">قائمة المتجر</span>
                <button onclick="toggleMenu()" class="text-gray-400 font-bold text-lg hover:text-white">✕</button>
            </div>
            <nav class="space-y-3 font-bold text-sm">
                <button onclick="toggleMenu(); triggerLoading(() => { goHome(); filterCategory('all'); })" class="w-full text-right py-3 px-3 rounded-lg hover:bg-[#232f3e] hover:text-[#febd69] transition">📋 الرئيسية وكل المنتجات</button>
                <button onclick="toggleMenu(); triggerLoading(() => { goHome(); filterCategory('ملابس'); })" class="w-full text-right py-3 px-3 rounded-lg hover:bg-[#232f3e] hover:text-[#febd69] transition">👕 قسم الملابس</button>
                <button onclick="toggleMenu(); triggerLoading(() => { goHome(); filterCategory('إكسسوارات'); })" class="w-full text-right py-3 px-3 rounded-lg hover:bg-[#232f3e] hover:text-[#febd69] transition">⌚ قسم الإكسسوارات</button>
                <button onclick="toggleMenu(); openProfileModal();" class="w-full text-right py-3 px-3 rounded-lg text-amber-400 hover:bg-[#232f3e] transition">⚙️ إعدادات المتجر والبروفايل</button>
                <a href="https://www.facebook.com/share/1Dgs3YPueM/" target="_blank" class="block py-3 px-3 rounded-lg text-[#febd69] hover:bg-[#232f3e] transition">📘 تابعنا على فيسبوك</a>
            </nav>
        </div>
        <div class="text-xs text-center text-gray-500 border-t border-gray-800 pt-3">
            DROP SHOPPING © 2026
        </div>
    </div>

    <!-- نافذة إعدادات البروفايل والأدمن -->
    <div id="profile-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-3">
        <div class="custom-card w-full max-w-xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center p-4 bg-gray-800 text-white border-b border-gray-700">
                <h3 class="font-bold text-sm text-amber-400">⚙️ إعدادات الحساب والبروفايل والتحكم</h3>
                <button onclick="closeProfileModal()" class="text-gray-400 font-bold text-lg hover:text-white">✕</button>
            </div>
            <div class="p-5 overflow-y-auto space-y-4 text-xs">
                <div class="bg-gray-100 dark:bg-gray-900 p-3 rounded-xl border border-gray-200 dark:border-gray-800">
                    <h4 class="font-bold text-sm mb-2 text-amber-500">🎨 مظهر المتجر (الثيم):</h4>
                    <div class="flex gap-2">
                        <button onclick="setTheme('light')" class="flex-1 bg-white text-gray-900 border p-2 rounded font-bold shadow-sm">☀️ وضع فاتح</button>
                        <button onclick="setTheme('dark')" class="flex-1 bg-gray-900 text-white border border-gray-700 p-2
