<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DROP SHOPPING - المتجر الإلكتروني</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        .product-card:hover { transform: translateY(-5px); transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <!-- شريط التنصيب العلوي -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-black text-gray-900 tracking-wider">DROP <span class="text-indigo-600">SHOPPING</span></h1>
            <div class="flex items-center gap-3">
                <button onclick="toggleAdminPanel()" class="bg-gray-900 text-white px-3 py-1.5 rounded-lg text-sm font-bold hover:bg-gray-800 transition">لوحة التحكم ⚙️</button>
                <button onclick="openCart()" class="relative bg-indigo-50 text-indigo-600 p-2 rounded-xl font-bold hover:bg-indigo-100 transition">
                    🛒 السلة <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- لوحة التحكم (إضافة وحذف المنتجات) -->
    <div id="admin-panel" class="hidden bg-gray-900 text-white p-6 shadow-xl border-b border-gray-800">
        <div class="max-w-4xl mx-auto">
            <h2 class="text-lg font-bold mb-4 text-indigo-400">إدارة المنتجات (لوحة التحكم الخاصة بك)</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-4">
                <input type="text" id="new-name" placeholder="اسم المنتج" class="p-2 rounded bg-gray-800 border border-gray-700 text-sm">
                <input type="number" id="new-price" placeholder="السعر (ج.م)" class="p-2 rounded bg-gray-800 border border-gray-700 text-sm">
                <input type="text" id="new-image" placeholder="رابط الصورة" class="p-2 rounded bg-gray-800 border border-gray-700 text-sm">
                <button onclick="addProduct()" class="bg-indigo-600 text-white p-2 rounded font-bold hover:bg-indigo-500 transition">إضافة المنتج</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                    <thead>
                        <tr class="border-b border-gray-800 text-gray-400">
                            <th class="py-2">المنتج</th>
                            <th class="py-2">السعر</th>
                            <th class="py-2">إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="admin-products-list">
                        <!-- المنتجات ستظهر هنا ديناميكياً -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- محتوى المتجر الرئيسي -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-black text-gray-900 mb-2">أحدث المنتجات والعروض</h2>
            <p class="text-gray-500 text-sm">تسوق أفضل المنتجات بأفضل الأسعار وبشحن سريع</p>
        </div>

        <!-- شبكة المنتجات -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- المنتجات ستعرض هنا تلقائياً -->
        </div>
    </main>

    <!-- سلة المشتريات الجانبية -->
    <div id="cart-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex justify-end">
        <div class="bg-white w-full max-w-md h-full p-6 flex flex-col justify-between shadow-2xl">
            <div>
                <div class="flex justify-between items-center mb-6 border-b pb-3">
                    <h3 class="text-lg font-bold">سلة المشتريات</h3>
                    <button onclick="closeCart()" class="text-gray-500 font-bold text-lg">✕</button>
                </div>
                <div id="cart-items" class="space-y-4 overflow-y-auto max-h-[60vh]">
                    <!-- عناصر السلة -->
                </div>
            </div>
            <div class="border-t pt-4">
                <div class="flex justify-between font-bold text-lg mb-4">
                    <span>الإجمالي:</span>
                    <span id="cart-total">0 ج.م</span>
                </div>
                <button onclick="checkoutWhatsApp()" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-500 transition shadow-lg">إتمام الطلب عبر واتساب 📱</button>
            </div>
        </div>
    </div>

    <!-- فوتر الموقع -->
    <footer class="bg-white border-t py-6 text-center text-sm text-gray-500">
        <p>جميع الحقوق محفوظة © DROP SHOPPING 2026</p>
    </footer>

    <script>
        // المنتجات الأساسية الافتراضية
        let defaultProducts = [
            { id: 1, name: "تيشيرت أوفر سايز قطن ياقة دائرية", price: 450, image: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500" },
            { id: 2, name: "جاكيت جينز كلاسيكي أزرق", price: 1200, image: "https://images.unsplash.com/photo-1576995853123-5a10305d93c0?w=500" },
            { id: 3, name: "بنطلون جينز واسع ستايل عصري", price: 650, image: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=500" }
        ];

        let products = JSON.parse(localStorage.getItem('drop_products')) || defaultProducts;
        let cart = [];

        function saveProducts() {
            localStorage.setItem('drop_products', JSON.stringify(products));
        }

        function renderStore() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            products.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between">
                        <img src="${p.image}" alt="${p.name}" class="w-full h-48 object-cover">
                        <div class="p-4 flex flex-col flex-grow justify-between">
                            <div>
                                <h3 class="font-bold text-gray-900 mb-1 text-base">${p.name}</h3>
                                <p class="text-indigo-600 font-black text-lg mb-4">${p.price} ج.م</p>
                            </div>
                            <button onclick="addToCart(${p.id})" class="w-full bg-gray-900 text-white py-2.5 rounded-xl font-bold hover:bg-indigo-600 transition text-sm">أضف للسلة</button>
                        </div>
                    </div>
                `;
            });
            renderAdminTable();
        }

        function toggleAdminPanel() {
            const panel = document.getElementById('admin-panel');
            panel.classList.toggle('hidden');
        }

        function addProduct() {
            const name = document.getElementById('new-name').value;
            const price = document.getElementById('new-price').value;
            const image = document.getElementById('new-image').value;

            if(!name || !price || !image) {
                alert('الرجاء إكمال كافة بيانات المنتج!');
                return;
            }

            const newP = { id: Date.now(), name, price: Number(price), image };
            products.push(newP);
            saveProducts();
            renderStore();

            document.getElementById('new-name').value = '';
            document.getElementById('new-price').value = '';
            document.getElementById('new-image').value = '';
            alert('تمت إضافة المنتج بنجاح!');
        }

        function deleteProduct(id) {
            products = products.filter(p => p.id !== id);
            saveProducts();
            renderStore();
        }

        function renderAdminTable() {
            const list = document.getElementById('admin-products-list');
            list.innerHTML = '';
            products.forEach(p => {
                list.innerHTML += `
                    <tr class="border-b border-gray-800">
                        <td class="py-2">${p.name}</td>
                        <td class="py-2">${p.price} ج.م</td>
                        <td class="py-2">
                            <button onclick="deleteProduct(${p.id})" class="bg-red-600 text-white px-2 py-1 rounded text-xs">حذف</button>
                        </td>
                    </tr>
                `;
            });
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            updateCartUI();
            openCart();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const itemsContainer = document.getElementById('cart-items');
            itemsContainer.innerHTML = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price;
                itemsContainer.innerHTML += `
                    <div class="flex justify-between items-center border-b pb-2">
                        <div>
                            <p class="font-bold text-sm">${item.name}</p>
                            <p class="text-indigo-600 text-xs">${item.price} ج.م</p>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-red-500 text-xs font-bold">إزالة</button>
                    </div>
                `;
            });
            document.getElementById('cart-total').innerText = total + ' ج.م';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function openCart() {
            document.getElementById('cart-modal').classList.remove('hidden');
        }

        function closeCart() {
            document.getElementById('cart-modal').classList.add('hidden');
        }

        function checkoutWhatsApp() {
            if(cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }
            let message = "مرحباً، أريـد طلب المنتجات التالية من متجر DROP SHOPPING:\n\n";
            let total = 0;
            cart.forEach((item, index) => {
                message += `${index + 1}. ${item.name} - ${item.price} ج.م\n`;
                total += item.price;
            });
            message += `\nالإجمالي الكلي: ${total} ج.م`;
            
            // استبدل الرقم برقم الواتساب الخاص بك مع كود الدولة (مثال: 20xxxxxxxxxx+)
            let phone = "201000000000"; 
            let url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        renderStore();
    </script>
</body>
</html>
